name: devconnect_manage_tool
description: "DevConnect Manage Tool - Desktop debugging & inspection tool for React Native, Flutter, and Android apps"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2

  # Navigation
  go_router: ^17.1.0

  # Code Generation / Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.8.0

  # UI
  flex_color_scheme: ^8.1.1
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  multi_split_view: ^3.1.0
  lucide_icons_flutter: ^3.1.11

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  collection: ^1.19.1
  path_provider: ^2.1.5
  window_manager: ^0.4.3
  file_selector_platform_interface: ^2.7.0
  file_selector: ^1.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.11.1
  freezed: ^3.2.5
  json_serializable: ^6.8.0
  riverpod_generator: ^4.0.3

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - docs/donate/
